<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Area & Perimeter Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .square-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-area {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-area:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-area:active {
            transform: translateY(0);
        }

        .btn-perimeter {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-perimeter:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.3);
        }

        .btn-perimeter:active {
            transform: translateY(0);
        }

        .btn-reset {
            width: 100%;
            background: #f0f0f0;
            color: #666;
            margin-top: 10px;
        }

        .btn-reset:hover {
            background: #e0e0e0;
            transform: none;
        }

        .result-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
            display: none;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-container.show {
            display: block;
        }

        .result-label {
            color: #999;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
        }

        .result-unit {
            color: #999;
            font-size: 14px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c33;
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #1976d2;
            line-height: 1.6;
        }

        .formula {
            font-weight: 600;
            font-family: 'Courier New', monospace;
            margin-top: 8px;
        }

        .visualization {
            margin-top: 20px;
            text-align: center;
        }

        .square-visual {
            width: 120px;
            height: 120px;
            border: 3px dashed #667eea;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-weight: 600;
            border-radius: 8px;
            background: rgba(102, 126, 234, 0.05);
        }

        .input-type-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .type-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .type-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .type-option label {
            cursor: pointer;
            color: #333;
            font-weight: 500;
            margin: 0;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .result-value {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="square-icon">⬜</div>
            <h1>Square Calculator</h1>
            <p>Calculate area and perimeter instantly</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="input-type-selector">
            <div class="type-option">
                <input 
                    type="radio" 
                    id="floatType" 
                    name="inputType" 
                    value="float"
                    checked
                >
                <label for="floatType">Decimal (Float)</label>
            </div>
            <div class="type-option">
                <input 
                    type="radio" 
                    id="intType" 
                    name="inputType" 
                    value="int"
                >
                <label for="intType">Whole Number (Int)</label>
            </div>
        </div>

        <div class="input-group">
            <label for="sideLength">Side Length (cm)</label>
            <input 
                type="number" 
                id="sideLength" 
                placeholder="Enter the length of the side"
                min="0"
                step="0.01"
            >
        </div>

        <div class="button-group">
            <button class="btn-area" onclick="calculateArea()">📐 Area</button>
            <button class="btn-perimeter" onclick="calculatePerimeter()">📏 Perimeter</button>
        </div>

        <button class="btn-reset" onclick="resetCalculator()">Clear</button>

        <div class="result-container" id="resultContainer">
            <div class="result-label" id="resultLabel"></div>
            <div class="result-value" id="resultValue"></div>
            <div class="result-unit" id="resultUnit"></div>
            <div class="visualization" id="visualization"></div>
        </div>

        <div class="info-box" id="infoBox" style="display: none;">
            <strong>📚 Formula Used:</strong>
            <div class="formula" id="formulaText"></div>
        </div>

        <div class="footer">
            <p>✨ Square Area & Perimeter Calculator v1.0</p>
        </div>
    </div>

    <script>
        const sideInput = document.getElementById('sideLength');
        const resultContainer = document.getElementById('resultContainer');
        const resultLabel = document.getElementById('resultLabel');
        const resultValue = document.getElementById('resultValue');
        const resultUnit = document.getElementById('resultUnit');
        const errorMessage = document.getElementById('errorMessage');
        const infoBox = document.getElementById('infoBox');
        const formulaText = document.getElementById('formulaText');
        const visualization = document.getElementById('visualization');
        const inputTypeRadios = document.querySelectorAll('input[name="inputType"]');

        let inputType = 'float'; // default value

        // Update input type when radio button changes
        inputTypeRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                inputType = this.value;
                updateInputStep();
                resetCalculator();
            });
        });

        function updateInputStep() {
            if (inputType === 'int') {
                sideInput.step = '1';
                sideInput.placeholder = 'Enter whole number (cm)';
            } else {
                sideInput.step = '0.01';
                sideInput.placeholder = 'Enter the length of the side';
            }
            sideInput.focus();
        }

        function validateInput() {
            const value = parseFloat(sideInput.value);
            errorMessage.classList.remove('show');

            if (sideInput.value === '') {
                showError('Please enter a side length');
                return null;
            }

            if (isNaN(value)) {
                showError('Please enter a valid number');
                return null;
            }

            if (value <= 0) {
                showError('Side length must be greater than 0');
                return null;
            }

            // If integer mode, convert to integer
            if (inputType === 'int') {
                if (!Number.isInteger(value)) {
                    showError('Please enter a whole number (integer)');
                    return null;
                }
                return value;
            }

            return value;
        }

        function formatResult(value) {
            if (inputType === 'int') {
                return Math.round(value);
            } else {
                return parseFloat(value.toFixed(2));
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            resultContainer.classList.remove('show');
            infoBox.style.display = 'none';
        }

        function calculateArea() {
            const side = validateInput();
            if (side === null) return;

            const area = side * side;
            const formattedArea = formatResult(area);
            resultLabel.textContent = '✓ Area Result';
            resultValue.textContent = formattedArea;
            resultUnit.textContent = 'sq.cm (Square Centimeters)';
            formulaText.textContent = `Area = side × side = ${side} × ${side} = ${formattedArea}`;
            visualization.innerHTML = `<div class="square-visual" style="width: ${Math.min(120, side * 4)}px; height: ${Math.min(120, side * 4)}px;">Area = ${formattedArea}</div>`;
            
            resultContainer.classList.add('show');
            infoBox.style.display = 'block';
        }

        function calculatePerimeter() {
            const side = validateInput();
            if (side === null) return;

            const perimeter = 4 * side;
            const formattedPerimeter = formatResult(perimeter);
            resultLabel.textContent = '✓ Perimeter Result';
            resultValue.textContent = formattedPerimeter;
            resultUnit.textContent = 'cm (Centimeters)';
            formulaText.textContent = `Perimeter = 4 × side = 4 × ${side} = ${formattedPerimeter}`;
            visualization.innerHTML = `<div class="square-visual" style="border-color: #f5576c; color: #f5576c; background: rgba(245, 87, 108, 0.05);">Perimeter = ${formattedPerimeter}</div>`;
            
            resultContainer.classList.add('show');
            infoBox.style.display = 'block';
        }

        function resetCalculator() {
            sideInput.value = '';
            resultContainer.classList.remove('show');
            errorMessage.classList.remove('show');
            infoBox.style.display = 'none';
            sideInput.focus();
        }

        // Allow Enter key to calculate
        sideInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateArea();
            }
        });

        // Focus on input on load
        window.addEventListener('load', function() {
            updateInputStep();
            sideInput.focus();
        });
    </script>
</body>
</html>
